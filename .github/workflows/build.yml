# 构建 + 发布。
#
# 站点产物 docs/ 不再入库：Pages 的 Source 设为 GitHub Actions，这里构建完直接把
# docs/ 作为 artifact 发布。好处是发布环境就是 CI 验过的环境，也不会再有「源码改了
# 但产物忘了重构建」这种只在产物入库方案里存在的漂移。
name: build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布；不做 cancel-in-progress，避免把线上停在半截版本
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 静态检查
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

      - name: 校验产物完整
        run: |
          test -f docs/index.html
          test -f docs/404.html
          test -f docs/wiki/index.json
          test -d docs/assets
          echo "docs 体积: $(du -sh docs | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
