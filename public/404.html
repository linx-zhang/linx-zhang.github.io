<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正在跳转…</title>
    <script>
      // GitHub Pages 对任意未知路径都会返回本页。
      // 把非根路径暂存到 sessionStorage，再回到根路径；
      // 是否放行由入口 src/main.tsx 里的 isKnownDeepLink 决定。
      (function () {
        var path = window.location.pathname

        if (path !== '/') {
          try {
            window.sessionStorage.setItem(
              'spa-fallback-path',
              path + window.location.search + window.location.hash,
            )
          } catch (e) {
            // 隐私模式下 sessionStorage 不可用时直接回首页
          }
        }

        window.location.replace('/')
      })()
    </script>
  </head>
  <body>
    <noscript>页面不存在，请返回 <a href="/">首页</a>。</noscript>
  </body>
</html>
